<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <link rel="stylesheet" href="https://use.typekit.net/kyl1fcz.css">
      <link rel="stylesheet" type="text/css" href="style.css">
      <title>Photo gallery</title>
      <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />
   </head>
   <body>
      <div class="container">
         <header>
            <h1>
               <a href="index.html"><img src="logo.svg" alt="in between."></a>
            </h1>
            <nav>
               <ul>
                  <li><a href="#">artists</a></li>
                  <li><a href="#">newcomers</a></li>
                  <li><a href="#">reviews</a></li>
                  <li><a href="#">culture</a></li>
                  <li><a href="#">playlists</a></li>
                  <li><a href="newsletter.html">subscribe to our newsletter</a></li>
               </ul>
            </nav>
         </header>
         <input class="input-gallery" type="radio" name="item" id="photo1" checked="checked">
         <input class="input-gallery" type="radio" name="item" id="photo2">
         <input class="input-gallery" type="radio" name="item" id="photo3">
         <input class="input-gallery" type="radio" name="item" id="photo4">
         <input class="input-gallery" type="radio" name="item" id="photo5">
         <input class="input-gallery" type="radio" name="item" id="photo6">
         <input class="input-gallery" type="radio" name="item" id="photo7">
         <input class="input-gallery" type="radio" name="item" id="photo8">
         <h2>Concerts of the year</h2>
         <main class="main-photo">
            <figure class="image-gallery">
               <img src="berq-concert.jpg" alt="Singer Berq sitting on a high chair at a concert in blue light.">
               <figcaption class="caption-gallery">Berq, Stuttgart</figcaption>
            </figure>
            <figure class="image-gallery">
               <img src="paula-hartmann-concert.jpg" alt="Singer Paula Hartmann on stage with pink light.">
               <figcaption class="caption-gallery">Paula Hartmann</figcaption>
            </figure>
            <figure class="image-gallery">
               <img src="ennio-concert.jpg" alt="Singer Ennio on stage surrounded by big crowd with flashlights.">
               <figcaption class="caption-gallery">Ennio, Munich</figcaption>
            </figure>
            <figure class="image-gallery">
               <img src="provinz-concert.jpg" alt="Singer of the band Provinz in blue blurry light.">
               <figcaption class="caption-gallery">Provinz, Wuhlheide</figcaption>
            </figure>
            <figure class="image-gallery">
               <img src="magda-concert.jpg" alt="Artist Magda singing to the crowd on stage.">
               <figcaption class="caption-gallery">Magda</figcaption>
            </figure>
            <figure class="image-gallery">
               <img src="kaffkiez-concert.jpg" alt="Crowd of a concert with the audience forming hearts with their hands.">
               <figcaption class="caption-gallery">Kaffkiez, Zurich</figcaption>
            </figure>
            <figure class="image-gallery">
               <img src="tobias-concert.jpg" alt="Singer Tobias on stage laughing.">
               <figcaption class="caption-gallery">Tobias, Munich</figcaption>
            </figure>
            <figure class="image-gallery">
               <img src="tjark-concert.jpg" alt="Big stage of a concert of the singer Tjark with bright yellow light.">
               <figcaption class="caption-gallery">Tjark, Berlin</figcaption>
            </figure>
         </main>
         <nav class="nav-gallery">
            <label for="photo1">
            <img src="berq-concert.jpg" alt="Singer Berq sitting on a high chair at a concert in blue light.">
            </label>
            <label for="photo2">
            <img src="paula-hartmann-concert.jpg" alt="Singer Paula Hartmann on stage with pink light.">
            </label>
            <label for="photo3">
            <img src="ennio-concert.jpg" alt="Singer Ennio on stage surrounded by big crowd with flashlights.">
            </label>
            <label for="photo4">
            <img src="provinz-concert.jpg" alt="Singer of the band Provinz in blue blurry light.">
            </label>
            <label for="photo5">
            <img src="magda-concert.jpg" alt="Artist Magda singing to the crowd on stage.">
            </label>
            <label for="photo6">
            <img src="kaffkiez-concert.jpg" alt="Crowd of a concert with the audience forming hearts with their hands.">
            </label>
            <label for="photo7">
            <img src="tobias-concert.jpg" alt="Singer Tobias on stage laughing.">
            </label>
            <label for="photo8">
            <img src="tjark-concert.jpg" alt="Big stage of a concert of the singer Tjark with bright yellow light.">
            </label>
         </nav>
         <footer>
            <p>All rights reserved.</p>
         </footer>
      </div>
   </body>
</html>
